services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: tradedemo
      POSTGRES_PASSWORD: tradedemo-local
      POSTGRES_DB: tradedemo
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - tradedemo_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tradedemo -d tradedemo"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  tradedemo_postgres:
